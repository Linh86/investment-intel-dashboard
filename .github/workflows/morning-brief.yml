# Scheduled morning brief — real scheduled automation with ZERO secrets.
#
# DEMO_MODE (the default) runs deterministic rule-based agents over synthetic
# fixture data, so this cron executes the entire pipeline (collect → triage →
# risk scoring → memo/CRM drafting) on a plain GitHub-hosted runner with no
# API keys and no repository secrets. A live deployment would point the same
# schedule at POST /api/runs/morning-brief instead.
name: Scheduled morning brief

on:
  schedule:
    # Weekdays at 07:00 UTC, before the (fictional) IC sits down.
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed database from synthetic fixtures
        run: npm run db:reset

      # Runs the pipeline with trigger 'cron', writes a markdown summary to
      # the job page, and fails the job unless the run completed.
      - name: Run morning brief
        run: |
          npx tsx -e "
          import { appendFileSync } from 'node:fs';
          import { runMorningBrief } from './lib/pipeline/morning-brief';
          (async () => {
            const result = await runMorningBrief('cron');
            console.log(JSON.stringify(result, null, 2));
            const summary = [
              '## Morning brief — ' + result.status,
              '',
              '> ' + result.note,
              '',
              '| Run | Signals created | Risk assessments | Artifacts drafted |',
              '| --- | --- | --- | --- |',
              '| ' + result.runId + ' | ' + result.signalsCreated + ' | ' + result.assessmentsCreated + ' | ' + result.artifactsDrafted + ' |',
              '',
            ].join('\n');
            if (process.env.GITHUB_STEP_SUMMARY) {
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            }
            if (result.status !== 'completed') {
              process.exit(1);
            }
          })();
          "
